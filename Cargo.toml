[package]
name = "postgres-restore-operator"
version = "0.4.11"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
bestool-canopy = "0.7.0"
bestool-kopia = { version = "0.4.0", features = ["proxy"] }
cronexpr = "1.5.0"
futures = "0.3.31"
globset = "0.4.18"
handlebars = "6.4.1"
jiff = { version = "0.2.25", features = ["serde"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
kube = { version = "4.0.0", default-features = false, features = ["runtime", "derive", "client", "rustls-tls", "ws"] }
kube_quantity = "0.9.0"
mimalloc = { version = "0.1.52", default-features = false }
prometheus = "0.14.0"
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["json", "socks"] }
rust_decimal = "1.42.0"
schemars = { version = "1.2.1", features = ["jiff02"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
socket2 = "0.6.2"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tokio-postgres = "0.7.18"
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
bytes = "1.12.0"
http = "1.4.2"
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = "0.5.3"

[[bin]]
name = "canopy-proxy"
path = "src/bin/canopy_proxy.rs"
