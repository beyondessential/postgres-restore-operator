[package]
name = "postgres-restore-operator"
version = "0.3.4"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
cronexpr = "1.4.0"
futures = "0.3.31"
globset = "0.4.18"
handlebars = "6.4.0"
jiff = { version = "0.2.23", features = ["serde"] }
k8s-openapi = { version = "0.27.1", features = ["latest", "schemars"] }
kube = { version = "3.1.0", default-features = false, features = ["runtime", "derive", "client", "rustls-tls", "ws"] }
kube_quantity = "0.9.0"
prometheus = "0.14.0"
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["json"] }
rust_decimal = "1.41.0"
schemars = { version = "1.2.1", features = ["jiff02"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tokio-postgres = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
tower = "0.5"
