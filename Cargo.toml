[package]
name = "postgres-restore-operator"
version = "0.0.13"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.101"
axum = "0.8.8"
chrono = { version = "0.4.43", features = ["serde"] }
cron = "0.15.0"
futures = "0.3.31"
globset = "0.4.18"
handlebars = "6.4.0"
jiff = "0.2.19"
k8s-openapi = { version = "0.27.0", features = ["latest"] }
kube = { version = "3.0.1", default-features = false, features = ["runtime", "derive", "client", "rustls-tls"] }
prometheus = "0.14.0"
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["json"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tower-http = { version = "0.6", features = ["trace"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json", "env-filter"] }
