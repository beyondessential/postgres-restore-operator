# postgres-restore-operator install manifest
# CRDs are not included — generate them with: cargo run --bin gen-crds
---
apiVersion: v1
kind: Namespace
metadata:
    name: pgro-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: postgres-restore-operator
    namespace: pgro-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: postgres-restore-operator
rules:
    # CRD access
    - apiGroups: ["pgro.bes.au"]
      resources:
          - postgresphysicalreplicas
          - postgresphysicalreplicas/status
          - postgresphysicalrestores
          - postgresphysicalrestores/status
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Secrets (kopia credentials, analytics credentials)
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Services (stable service per replica)
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # PVCs (restore data volumes)
    - apiGroups: [""]
      resources: ["persistentvolumeclaims"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Jobs (restore jobs)
    - apiGroups: ["batch"]
      resources: ["jobs"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Deployments (postgres instances)
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Pods (reading Job pod termination messages, self-annotation, orphan cleanup)
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "patch", "delete"]
    # Namespaces (canopy-path replica namespaces are labelled + annotated
    # by the worklist syncer, and torn down when a declaration goes away)
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Pod port-forward (overlay FDW reconciliation)
    - apiGroups: [""]
      resources: ["pods/portforward"]
      verbs: ["create"]
    # Events (events.k8s.io/v1)
    - apiGroups: ["events.k8s.io"]
      resources: ["events"]
      verbs: ["create", "patch"]
    # CNPG Clusters (overlay database)
    - apiGroups: ["postgresql.cnpg.io"]
      resources: ["clusters"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # CNPG Image Catalogs (PG version discovery)
    - apiGroups: ["postgresql.cnpg.io"]
      resources: ["clusterimagecatalogs", "imagecatalogs"]
      verbs: ["get", "list"]
    # Leader election
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: postgres-restore-operator
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: postgres-restore-operator
subjects:
    - kind: ServiceAccount
      name: postgres-restore-operator
      namespace: pgro-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: postgres-restore-operator-config
    namespace: pgro-system
rules:
    - apiGroups: [""]
      resources: ["configmaps"]
      resourceNames: ["postgres-restore-operator-config"]
      verbs: ["get", "list", "watch"]
    # Tailscale sidecar persists tailnet state in this Secret so a restart
    # rejoins as the same node identity — the sidecar writes to it under
    # the operator's ServiceAccount.
    - apiGroups: [""]
      resources: ["secrets"]
      resourceNames: ["pgro-operator-tailscale-state"]
      verbs: ["get", "update", "patch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: postgres-restore-operator-config
    namespace: pgro-system
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: postgres-restore-operator-config
subjects:
    - kind: ServiceAccount
      name: postgres-restore-operator
      namespace: pgro-system
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: postgres-restore-operator-config
    namespace: pgro-system
data: {}
---
apiVersion: v1
kind: Service
metadata:
    name: postgres-restore-operator
    namespace: pgro-system
    labels:
        app.kubernetes.io/name: postgres-restore-operator
        app.kubernetes.io/component: controller
    annotations:
        prometheus.io/port: "8080"
        prometheus.io/scheme: http
        prometheus.io/scrape: "true"
spec:
    ports:
        - name: http
          port: 8080
          targetPort: http
        # Credential-broker port. Reached from canopy-backed Job pods'
        # proxy sidecars in-cluster only; NetworkPolicy below gates
        # ingress to Pods carrying pgro.bes.au/proxy-sidecar=true.
        - name: broker
          port: 9091
          targetPort: broker
    selector:
        app.kubernetes.io/name: postgres-restore-operator
        app.kubernetes.io/component: controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres-restore-operator
    namespace: pgro-system
    labels:
        app.kubernetes.io/name: postgres-restore-operator
        app.kubernetes.io/component: controller
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app.kubernetes.io/name: postgres-restore-operator
            app.kubernetes.io/component: controller
    template:
        metadata:
            labels:
                app.kubernetes.io/name: postgres-restore-operator
                app.kubernetes.io/component: controller
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "8080"
        spec:
            serviceAccountName: postgres-restore-operator
            securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                fsGroup: 65534
            containers:
                - name: controller
                  image: ghcr.io/beyondessential/postgres-restore-operator:latest
                  env:
                      # - name: RUST_LOG
                      #   value: "info,tower_http=debug"
                      - name: METRICS_ADDR
                        value: "[::]:8080"
                      - name: OPERATOR_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                      - name: OPERATOR_SERVICE_NAME
                        value: postgres-restore-operator
                      # ------------------------------------------------
                      # Canopy integration — see docs/canopy-backup-integration.md
                      # ------------------------------------------------
                      # Uncomment CANOPY_BASE_URL to opt into the canopy path.
                      # Leaving it unset keeps the operator in legacy-only mode
                      # (existing PostgresPhysicalReplica CRDs continue to work).
                      # - name: CANOPY_BASE_URL
                      #   value: https://canopy.example.com
                      # SOCKS5 proxy the operator's Tailscale sidecar exposes.
                      # Default [::1]:1055 matches the sidecar's TS_SOCKS5_SERVER.
                      # - name: CANOPY_SOCKS5_PROXY
                      #   value: socks5://[::1]:1055
                      # Optional mTLS fallback if the tailnet probe fails.
                      # - name: CANOPY_DEVICE_CERT_SECRET
                      #   value: pgro-canopy-device-cert
                      # Worklist tick cadence (jittered ±20%). Default 30.
                      # - name: CANOPY_RECONCILE_INTERVAL_SECS
                      #   value: "30"
                      # Sidecar image spawned into each canopy-backed
                      # restore Job. Overrides the built-in default so
                      # operators can pin to a specific tag.
                      # - name: CANOPY_PROXY_IMAGE
                      #   value: ghcr.io/beyondessential/pgro-canopy-proxy:latest
                      # Default PVC size for canopy-provisioned pgdata.
                      # - name: CANOPY_PGDATA_PVC_SIZE
                      #   value: "20Gi"
                  ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP
                      - name: broker
                        containerPort: 9091
                        protocol: TCP
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: http
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /livez
                          port: http
                      initialDelaySeconds: 15
                      periodSeconds: 20
                  resources:
                      requests:
                          cpu: 50m
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          memory: 1Gi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                # Tailscale sidecar — the primary production network path
                # to canopy. bestool-canopy's CanopyClient auto-probes
                # canopy.tail53aef.ts.net; the SOCKS5 proxy on [::1]:1055
                # is what makes that probe succeed from in-cluster.
                #
                # Ops (one-time per cluster) provisions:
                # - the Tailscale k8s operator;
                # - an OAuth-issued authkey carrying the pgro ACL tag,
                #   stored in the pgro-operator-tailscale-authkey Secret
                #   at the TS_AUTHKEY key;
                # - the pgro-operator-tailscale-state Secret (empty,
                #   writable by this pod for TS state persistence).
                - name: tailscale
                  image: ghcr.io/tailscale/tailscale:v1.80
                  env:
                      - name: TS_USERSPACE
                        value: "true"
                      - name: TS_SOCKS5_SERVER
                        value: "[::]:1055"
                      - name: TS_HOSTNAME
                        value: pgro-operator
                      - name: TS_KUBE_SECRET
                        value: pgro-operator-tailscale-state
                      - name: TS_AUTHKEY
                        valueFrom:
                            secretKeyRef:
                                name: pgro-operator-tailscale-authkey
                                key: TS_AUTHKEY
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      capabilities:
                          drop: ["ALL"]
                  resources:
                      requests:
                          cpu: 20m
                          memory: 64Mi
                      limits:
                          cpu: 200m
                          memory: 256Mi
---
# NetworkPolicy restricting the credential-broker port (9091) to Pods
# labelled `pgro.bes.au/proxy-sidecar=true` — the label the canopy Job
# builder puts on kopia-restore Pods so their sidecars can reach the
# broker. Metrics port (8080) is left open per the existing Service +
# Prometheus scrape convention.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: postgres-restore-operator-broker
    namespace: pgro-system
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: postgres-restore-operator
            app.kubernetes.io/component: controller
    policyTypes:
        - Ingress
    ingress:
        # Allow the metrics port from anywhere in-cluster.
        - ports:
              - port: 8080
                protocol: TCP
        # Allow the broker port only from canopy Job proxy sidecars.
        - from:
              - namespaceSelector: {}
                podSelector:
                    matchLabels:
                        pgro.bes.au/proxy-sidecar: "true"
          ports:
              - port: 9091
                protocol: TCP
