---
apiVersion: v1
kind: Namespace
metadata:
    name: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: minio
    namespace: minio
spec:
    replicas: 1
    selector:
        matchLabels:
            app: minio
    template:
        metadata:
            labels:
                app: minio
        spec:
            containers:
                - name: minio
                  image: rustfs/rustfs:1.0.0
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 9000
                        name: api
                      - containerPort: 9001
                        name: console
                  env:
                      - name: RUSTFS_ADDRESS
                        value: ":9000"
                      - name: RUSTFS_ACCESS_KEY
                        value: minioadmin
                      - name: RUSTFS_SECRET_KEY
                        value: minioadmin
                  readinessProbe:
                      httpGet:
                          path: /minio/health/ready
                          port: 9000
                      initialDelaySeconds: 5
                      periodSeconds: 5
                  volumeMounts:
                      - name: data
                        mountPath: /data
            volumes:
                - name: data
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: minio
    namespace: minio
spec:
    selector:
        app: minio
    ports:
        - name: api
          port: 9000
          targetPort: 9000
        - name: console
          port: 9001
          targetPort: 9001
