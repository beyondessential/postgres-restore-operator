---
# Static-manifest HTTP server for the redaction integration test.
#
# The harness `kubectl apply`s this into the test namespace; the redacted
# replica's spec.redaction.manifestUrl points at
# http://manifest-server.<ns>.svc/manifest.json
apiVersion: v1
kind: ConfigMap
metadata:
    name: manifest-server-content
data:
    manifest.json: |
        {
          "sources": {
            "source.tamanu.tamanu.users": {
              "schema": "public",
              "name": "users",
              "columns": {
                "email":       { "config": { "meta": { "masking": "email" } } },
                "full_name":   { "config": { "meta": { "masking": "name" } } },
                "single_name": { "config": { "meta": { "masking": "name" } } },
                "dob":         { "config": { "meta": { "masking": "date" } } },
                "phone":       { "config": { "meta": { "masking": "phone" } } },
                "heart_rate":  { "config": { "meta": { "masking": { "kind": "integer", "range": "50-100" } } } }
              }
            },
            "source.tamanu.tamanu.sync_lookup": {
              "schema": "public",
              "name": "sync_lookup",
              "config": { "meta": { "masking": "truncate" } },
              "columns": {}
            }
          }
        }
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: manifest-server
    labels:
        app: manifest-server
spec:
    replicas: 1
    selector:
        matchLabels:
            app: manifest-server
    template:
        metadata:
            labels:
                app: manifest-server
        spec:
            containers:
                - name: nginx
                  image: nginx:alpine
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 80
                  volumeMounts:
                      - name: content
                        mountPath: /usr/share/nginx/html
            volumes:
                - name: content
                  configMap:
                      name: manifest-server-content
---
apiVersion: v1
kind: Service
metadata:
    name: manifest-server
spec:
    selector:
        app: manifest-server
    ports:
        - port: 80
          targetPort: 80
